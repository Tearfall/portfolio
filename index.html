<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Joar Crisostomo — junior web developer based in General Trias, Cavite, Philippines." />
    <title>Joar Crisostomo — Junior Web Developer</title>
    <script>
      // Settle light vs dark before the first paint, otherwise a dark-mode
      // visitor gets a flash of the light page while Vue boots.
      (function () {
        var mode
        try { mode = localStorage.getItem('portfolio:color-mode') } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.mode = mode
        document.documentElement.style.colorScheme = mode
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
